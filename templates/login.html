<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Entrar - Gaivota Reuniões</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; width: 100%; max-width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; color: #fff; }
        .btn-login { background: #2563eb; }
        .btn-login:hover { background: #1d4ed8; }
        .btn-reg { background: #059669; }
        .btn-reg:hover { background: #047857; }
        .error { background: #7f1d1d; color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🪶 Gaivota Reuniões</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <label>Usuário:</label>
            <input type="text" name="username" required placeholder="Digite seu usuário">
            
            <label>Senha:</label>
            <input type="password" name="password" required placeholder="Digite sua senha">
            
            <div class="btn-group">
                <button type="submit" name="action" value="login" class="btn-login">Entrar</button>
                <button type="submit" name="action" value="register" class="btn-reg">Cadastrar</button>
            </div>
        </form>
    </div>
</body>
</html>
